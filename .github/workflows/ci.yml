name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── 方法论布局门：独立 job，红了立刻可见，不与被测代码混在一起 ──────────────
  layout:
    name: "Sprint layout gate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: "Layout gate (methodology binding)"
        run: node tools/check-sprint-layout.mjs
      - name: "Layout gate mutation verification (8/8 criteria can go red)"
        run: node tools/verify-layout-mutations.mjs
      - name: "Desensitization gate (no host paths / usernames / local proxy)"
        run: node tools/check-desensitized.mjs

  # ── 生成物与镜像一致性：数据源与内嵌副本不得漂移 ────────────────────────
  consistency:
    name: "Generated artefacts in sync"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
      - name: "Version mirror"
        run: node tools/sync-version.mjs --check
      - name: "Profile mirror"
        run: node tools/sync-profiles.mjs --check
      - name: "Golden manifest"
        run: node tools/gen-golden-manifest.mjs --check

  test:
    name: "test (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is in the push matrix on purpose: the release assets include
        # darwin/arm64, and a tag-only failure would force a re-tag.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
      - name: "go vet"
        run: go vet ./...
      - name: "go test"
        run: go test ./...
      - name: "Build static binary"
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o dist/cfgdelta ./cmd/cfgdelta
      - name: "Golden selftest"
        shell: bash
        run: |
          set -euo pipefail
          ./dist/cfgdelta selftest
      - name: "Exit code contract smoke"
        shell: bash
        run: |
          set -euo pipefail
          # 用法错误必须是 3（K-07），不是 2 / 1。
          set +e
          ./dist/cfgdelta nosuchcommand >/dev/null 2>&1
          code=$?
          set -e
          test "$code" = "3"
          # 等价输入必须是 0。
          ./dist/cfgdelta diff --profile k8s/v1.29 testdata/golden/testA/k1.yaml testdata/golden/testA/k2.yaml >/dev/null
          # 反例必须非 0（1Gi vs 1000M）。
          set +e
          ./dist/cfgdelta diff --coerce-at "/limits/*=quantity" testdata/golden/testC/c08-left.yaml testdata/golden/testC/c08-right.yaml >/dev/null 2>&1
          code=$?
          set -e
          test "$code" = "1"
      - name: "Determinism (two runs, identical bytes)"
        shell: bash
        run: |
          set -euo pipefail
          # `classify` exits 1 when it finds a behavioural difference — that IS the
          # expected result for testA without a profile. Under `set -e` the first
          # run would abort the step before cmp ever executed (caught on the first
          # real CI run). Only cmp and the exit-code equality decide this step.
          set +e
          ./dist/cfgdelta classify testdata/golden/testA/k1.yaml testdata/golden/testA/k2.yaml > run1.txt 2>&1
          rc1=$?
          ./dist/cfgdelta classify testdata/golden/testA/k1.yaml testdata/golden/testA/k2.yaml > run2.txt 2>&1
          rc2=$?
          set -e
          test "$rc1" = "$rc2"
          cmp run1.txt run2.txt
          echo "deterministic: identical bytes and exit code $rc1"

  # ── 发布产物：三平台**原生**构建（不是交叉编译）+ 原生冒烟 ────────────────
  # 只在 v* tag 上跑：VERSION 必须与 tag 一致（K-03 版本单一来源），
  # 三条产物的冒烟都在各自平台上真跑一遍 selftest。
  release-build:
    name: "release build (${{ matrix.asset }})"
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: cfgdelta-linux-amd64
          - os: macos-latest
            asset: cfgdelta-darwin-arm64
          - os: windows-latest
            asset: cfgdelta-windows-amd64.exe
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
      - name: "Version single source (VERSION == tag)"
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::VERSION ($version) does not match tag ($tag) — K-03"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: "Build static binary"
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
            -o "dist/${{ matrix.asset }}" ./cmd/cfgdelta
      - name: "Native smoke (version + golden selftest)"
        shell: bash
        run: |
          set -euo pipefail
          "./dist/${{ matrix.asset }}" --version
          "./dist/${{ matrix.asset }}" selftest
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  # ── GitHub Release：三平台二进制 + SHA256SUMS（手工上传附件）─────────────
  publish:
    name: "publish release"
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: "Checksums + manifest"
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          ls -l
          sha256sum cfgdelta-* > SHA256SUMS
          cat SHA256SUMS
          # Notes live at the workspace root, NOT under dist/ — the next step runs
          # from the repo root and would otherwise fail with
          # "open RELEASE_NOTES.md: no such file or directory" (hit on v0.1.0).
          notes="$GITHUB_WORKSPACE/RELEASE_NOTES.md"
          {
            printf 'cfgdelta %s — behavioural config diff (normalization layer + impact classification layer).\n\n' "${GITHUB_REF_NAME#v}"
            printf 'Single static binary, zero runtime dependencies, no external commands.\n\n'
            printf 'Native builds: linux/amd64, darwin/arm64, windows/amd64.\n'
            printf 'Verify the downloads: sha256sum -c SHA256SUMS\n\n'
            printf 'The golden suite (76 cases) runs offline, but it is NOT embedded in the binary.\n'
            printf '`selftest` looks for `testdata/golden` by walking up from the working directory,\n'
            printf 'then up from the executable directory. It must therefore be run from inside a\n'
            printf 'checkout of this tag:\n\n'
            printf '    cd <checkout of %s> && ./cfgdelta-linux-amd64 selftest\n' "${GITHUB_REF_NAME}"
            printf '    # selftest: 76 passed, 0 failed, 0 skipped\n\n'
            printf 'Run from an unrelated directory it exits 3 with "testdata/golden not found".\n'
            printf 'There is no `--root` flag (`--version` and `--help` are the only global flags).\n'
          } > "$notes"
          test -s "$notes"
      - name: "Create GitHub Release"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(
            dist/cfgdelta-linux-amd64
            dist/cfgdelta-darwin-arm64
            dist/cfgdelta-windows-amd64.exe
            dist/SHA256SUMS
          )
          # Idempotent: a re-run after a partial failure must not fail on
          # "release already exists" — it uploads over the existing release.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "cfgdelta ${GITHUB_REF_NAME#v}" \
              --notes-file RELEASE_NOTES.md \
              --verify-tag
          fi
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "\(.name)  \(.size)  \(.digest)"'
