apiVersion: apps/v1
kind: Deployment
metadata:
  name: synth-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: synth-a
  template:
    metadata:
      labels:
        app: synth-a
    spec:
      containers:
        - name: web
          image: registry.example/synth/web:1.0.0
          ports:
            - containerPort: 80
          resources:
            limits:
              memory: 1Gi
              cpu: 500m
