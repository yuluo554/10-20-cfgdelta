apiVersion: apps/v1
kind: Deployment
metadata:
  name: synth-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: synth-a
  template:
    metadata:
      labels:
        app: synth-a
    spec:
      containers:
        - name: web
          image: registry.example/synth/web:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            limits:
              memory: 1024Mi
              cpu: 0.5
